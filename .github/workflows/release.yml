name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: write
  packages: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            rpm \
            libfuse2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build the app
        if: matrix.platform != 'windows-latest'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: |
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full list of changes in this release.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build executable + NSIS installer (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          bun run tauri:build -- --bundles nsis
          if (-not (Test-Path "src-tauri/target/release/tauri-svelte-file-explorer.exe")) {
            Write-Error "Executable not found after build"
            exit 1
          }

      - name: Create portable .zip (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $exe = Get-ChildItem -Path "src-tauri/target/release" -Filter "tauri-svelte-file-explorer.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Write-Error "Executable not found"; exit 1 }

          $stage = "portable-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $exe.FullName -Destination "$stage/Tauri File Explorer.exe"

          @"
          Tauri File Explorer v$version - Portable
          =====================================

          Requirements:
            - Windows 10 (1803 or later) or Windows 11
            - WebView2 Runtime (preinstalled on most systems)

          How to run:
            1. Extract this zip to any folder
            2. Double-click "Tauri File Explorer.exe"
          "@ | Out-File -FilePath "$stage/README.txt" -Encoding utf8

          $zipPath = "src-tauri/target/release/bundle/portable/Tauri-File-Explorer_${version}_x64_portable.zip"
          New-Item -ItemType Directory -Force -Path (Split-Path $zipPath) | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath
          Remove-Item -Recurse -Force $stage
          Write-Host "Created: $zipPath"

      - name: Upload portable .zip to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/portable/*.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload NSIS installer to release
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
