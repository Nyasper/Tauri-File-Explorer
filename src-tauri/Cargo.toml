[package]
name = "tauri-svelte-file-explorer"
version = "1.0.0"
description = "Cross-platform desktop file explorer built with Tauri v2 and Svelte 5."
authors = ["herre"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_svelte_file_explorer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
tokio = { version = "1", features = ["fs", "rt-multi-thread", "macros", "sync"] }
futures = "0.3"

